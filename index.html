<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>NITO - Store (Project-4)</title>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">
            <h2>NITO<span>.Store</span></h2>
        </div>
        <div class="navbar-search">
            <form>
                <input type="search" name="order" id="order" placeholder="Search products...">
                <button type="submit">
                    <img src="img/search.png" width="20px">
                </button>
            </form>
        </div>
        <div class="navbar-order">
            <img src="img/shopping-cart.png" width="20px" >
            <span class="cart-count">0</span>
        </div>
        <div class="login-signup">
            <button id="log-in">Log in</button>
            <button id="sign-up">Sign Up</button>
        </div>
    </nav>
    <main class="page">
        <div class="main-hero">

            <div class="content">
                <h1>Upgrade your style</h1>
                <p>Clean designs. Premium quality. Made for everyday use.</p>
            </div>
            <div class="bottom-slice">
                <div class="accounts">
                    <a href="#">
                       <img src="img/discord(1).png" width="22px" alt="">
                    </a>
                </div>
                <div class="accounts">
                    <a href="#">
                      <img src="img/instagram(1).png" width="22" alt="">
                    </a>
                </div>
                <div class="accounts">
                    <a href="#">
                       <img src="img/github.png" width="22" alt="">
                    </a>
                </div>
            </div>

            <div class="floating-image">
                <img src="img/blue-shopping-cart-empty-shopping-basket-with-checkmark-3d-illustration-background.png" width="300px">
            </div>

        </div>
        <div class="products">
            <div class="product-card">
                <div class="product-img">
                    <img src="img/hoddie.png">

                </div>
                <h3>Essential Hoodie</h3>
                <p>$49.00</p>
                <button>Add to cart</button>
            </div>
            <div class="product-card">
                <div class="product-img">
                    <img src="img/T-Shirt.png">
                </div>
                <h3>Minimal T-Shirt</h3>
                <p>$29.00</p>
                <button>Add to cart</button>
            </div>
            <div class="product-card">
                <div class="product-img">
                    <img src="img/Jacket.png" >

                </div>
                <h3>Urban Jacket</h3>
                <p>$79.00</p>
                <button>Add to cart</button>
            </div>
            <div class="product-card">
                <div class="product-img">
                    <img src="img/Cap.png" >

                </div>
                <h3>Classic Cap</h3>
                <p>$19.00</p>
                <button>Add to cart</button>
            </div>
            <div class="product-card">
                <div class="product-img">
                    <img src="img/shoes.png">

                </div>
                <h3>Street Sneakers</h3>
                <p>$89.00</p>
                <button>Add to cart</button>
            </div>
            <div class="product-card">
                <div class="product-img">
                    <img src="img/idk.png" >

                </div>
                <h3>Hillal Outfit</h3>
                <p>$1.25</p>
                <button>Add to cart</button>
            </div>
        </div>
        

    </main>
</body>
</html>
